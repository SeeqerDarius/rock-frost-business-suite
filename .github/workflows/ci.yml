name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A placeholder, unreachable DATABASE_URL/DIRECT_URL is intentional here —
# `prisma validate` and `prisma generate` only need the schema file and a
# syntactically-present datasource url; neither actually connects to a
# database. Do not point these at a real database from CI. If a future step
# ever needs a live connection (e.g. `prisma migrate deploy` against a
# disposable CI database), add it as a separate job with a real service
# container rather than changing what these placeholders point at.
env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci_placeholder
  NEXTAUTH_URL: http://localhost:3000
  NEXTAUTH_SECRET: ci-placeholder-secret-not-for-real-use

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Unit/integration tests
        run: npm run test

      - name: Production build
        run: npm run build
